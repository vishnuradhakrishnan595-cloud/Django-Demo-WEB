<!DOCTYPE html>

<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniShop - Change Password</title>

    <script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="min-h-screen
             bg-slate-50
             flex
             items-center
             justify-center
             px-4">

    <div class="w-full
            max-w-md
            bg-white
            rounded-3xl
            border
            border-slate-200
            shadow-lg
            p-6
            sm:p-8">


        <!-- HEADER -->

        <div class="text-center
            mb-7">

            <div class="w-14
                h-14
                mx-auto
                rounded-2xl
                bg-gradient-to-br
                from-indigo-600
                to-violet-600
                flex
                items-center
                justify-center
                text-white
                text-xl
                font-bold">

                M

            </div>


            <h1 class="text-2xl
               font-bold
               text-slate-900
               mt-4">

                Change Password

            </h1>


            <p class="text-sm
              text-slate-400
              mt-1">

                Update your MiniShop account password

            </p>

        </div>



        <!-- MESSAGES -->

        {% if messages %}

        {% for message in messages %}

        <div class="mb-4
                    px-4
                    py-3
                    rounded-xl
                    bg-red-50
                    border
                    border-red-100
                    text-sm
                    text-red-600">

            {{ message }}

        </div>

        {% endfor %}

        {% endif %}



        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- CURRENT PASSWORD -->

            <div class="mb-5">

                <label class="block
                      text-sm
                      font-semibold
                      text-slate-700
                      mb-2">

                    Current Password

                </label>

                <input type="password" name="current_password" required autocomplete="current-password" class="w-full
                      px-4
                      py-3
                      rounded-xl
                      border
                      border-slate-200
                      outline-none
                      focus:border-indigo-500
                      focus:ring-2
                      focus:ring-indigo-100">

            </div>



            <!-- NEW PASSWORD -->

            <div class="mb-5">

                <label class="block
                      text-sm
                      font-semibold
                      text-slate-700
                      mb-2">

                    New Password

                </label>

                <input type="password" name="new_password" required minlength="8" autocomplete="new-password" class="w-full
                      px-4
                      py-3
                      rounded-xl
                      border
                      border-slate-200
                      outline-none
                      focus:border-indigo-500
                      focus:ring-2
                      focus:ring-indigo-100">

                <p class="text-xs
                  text-slate-400
                  mt-2">

                    Minimum 8 characters with at least one letter and number.

                </p>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="mb-6">

                <label class="block
                      text-sm
                      font-semibold
                      text-slate-700
                      mb-2">

                    Confirm New Password

                </label>

                <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" class="w-full
                      px-4
                      py-3
                      rounded-xl
                      border
                      border-slate-200
                      outline-none
                      focus:border-indigo-500
                      focus:ring-2
                      focus:ring-indigo-100">

            </div>



            <!-- BUTTON -->

            <button type="submit" class="w-full
                   py-3.5
                   rounded-xl
                   bg-gradient-to-r
                   from-indigo-600
                   to-violet-600
                   hover:from-indigo-700
                   hover:to-violet-700
                   text-white
                   font-bold
                   text-sm
                   transition">

                Change Password

            </button>


        </form>



        <!-- BACK -->

        <div class="text-center
            mt-5">

            <a href="{% url 'profile' %}" class="text-sm
              font-semibold
              text-indigo-600
              hover:text-indigo-700">

                ← Back to Profile

            </a>

        </div>


    </div>

</body>

</html>
